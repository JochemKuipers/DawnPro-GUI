name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Debian tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev lintian fakeroot man-db

      - name: Version from changelog
        id: version
        run: |
          CHG="$(dpkg-parsechangelog -S Version)"
          echo "version=${CHG%-*}" >> "$GITHUB_OUTPUT"
          echo "deb_version=${CHG}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../dawnpro-gui_*_all.deb dist/
          ls -l dist/

      - name: lintian
        run: lintian --fail-on error dist/dawnpro-gui_*_all.deb

      - uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: dist/dawnpro-gui_*_all.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: dawnpro-gui ${{ steps.version.outputs.deb_version }}
          body: |
            Debian package of [DawnPro-GUI](https://github.com/shaypower/DawnPro-GUI).

            ## Installation

            ```sh
            curl -fsSL https://jochemkuipers.github.io/apt-repo/jochem.sources \
              | sudo tee /etc/apt/sources.list.d/jochem.sources
            sudo apt update
            sudo apt install dawnpro-gui
            ```
          files: |
            dist/dawnpro-gui_*_all.deb
          generate_release_notes: false
